name: Build & test

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # main only takes dev from this repo. The test lives in the `if`, not in
  # `run:`, so the branch name never reaches a shell. Skipped (passing) on
  # PRs into dev.
  only-dev-to-main:
    if: github.base_ref == 'main' && (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::PRs into main must come from dev"
          exit 1

  # Every release is deliberate: a PR into main must raise package.json past
  # the latest v* tag and turn CHANGELOG.md's "## Unreleased" into that
  # version's "## X.Y.Z — YYYY-MM-DD" section. Skipped (passing) on PRs into dev.
  version-bumped:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags

      - name: Version is past the latest tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! grep -qE "^## $(printf '%s' "$VERSION" | sed 's/\./\\./g') — [0-9]{4}-[0-9]{2}-[0-9]{2}\s*$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION — YYYY-MM-DD' section. Rename '## Unreleased' to it"
            exit 1
          fi
          if grep -qE '^## Unreleased\s*$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md still has '## Unreleased'. Rename it to '## $VERSION — YYYY-MM-DD'"
            exit 1
          fi
          # Prod tags only: the glob alone matches v0.12.0-alpha.1, which sort -V ranks above v0.12.0.
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "No release tag yet; $VERSION passes."
            exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -n 1)
          if [ "$VERSION" = "$LATEST" ] || [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::package.json is $VERSION, latest release is v$LATEST. Raise the version in package.json and add its CHANGELOG.md section"
            exit 1
          fi
          echo "$VERSION is past v$LATEST."
